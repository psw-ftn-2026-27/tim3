<div class="stack">
  <input
    class="file-input"
    type="file"
    accept="image/jpeg,image/png,image/webp"
    [id]="inputId"
    (change)="select($event)"
  />
  <label class="button" [for]="inputId">Choose image</label>

  @if (previewUrl()) {
    <img class="thumbnail" [src]="previewUrl()" alt="Selected image" />
    <p class="meta">Selected image: {{ file()?.name }}</p>
  }

  <button
    class="button button--primary"
    type="button"
    [disabled]="file() === null || pending()"
    (click)="send.emit()"
  >
    Upload
  </button>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }
</div>
