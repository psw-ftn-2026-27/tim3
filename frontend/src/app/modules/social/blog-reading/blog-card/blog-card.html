<article class="card">
  @if (blog().images.length > 0) {
    <img class="cover" [src]="blog().images[0]" alt="" />
  }

  <p class="meta">{{ published() }} · {{ commentCount() }}</p>

  <h2>{{ blog().title }}</h2>

  <p class="description">{{ blog().description }}</p>

  <div class="footer">
    <span class="badge">{{ blog().status }}</span>
    <a class="button" [routerLink]="['/social', blog().id]">Read more</a>
  </div>
</article>
