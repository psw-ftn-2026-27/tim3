<article class="card stack">
  <h3>{{ club().name }}</h3>

  <p>{{ club().description }}</p>

  <div class="images">
    @for (image of club().images; track $index) {
      <img class="thumbnail" [src]="image" alt="Image of club {{ club().name }}" />
    }
  </div>

  @if (canManage()) {
    @if (confirming()) {
      <div class="stack">
        <p>Are you sure you want to delete this club?</p>
        <div class="actions">
          <button
            class="button button--primary"
            type="button"
            [disabled]="pending()"
            (click)="confirmDelete()"
          >
            Confirm
          </button>
          <button class="button" type="button" (click)="confirming.set(false)">Cancel</button>
        </div>
      </div>
    } @else {
      <div class="actions">
        <button class="button" type="button" (click)="editClub.emit(club())">Edit</button>
        <button class="button" type="button" (click)="confirming.set(true)">Delete</button>
      </div>
    }
  }
</article>
