<div class="card stack">
  <h1>New quiz</h1>

  <form class="stack" (submit)="submit($event)">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" [formField]="form.title" />
      @if (form.title().touched()) {
        @for (message of form.title().errors(); track $index) {
          <p class="error">{{ message.message }}</p>
        }
      }
    </div>

    <div class="field">
      <label for="description">Short description</label>
      <textarea id="description" rows="3" [formField]="form.description"></textarea>
    </div>

    <div class="field">
      <label for="experience-points">Experience points (XP)</label>
      <input id="experience-points" type="number" [formField]="form.experiencePoints" />
      @if (form.experiencePoints().touched()) {
        @for (message of form.experiencePoints().errors(); track $index) {
          <p class="error">{{ message.message }}</p>
        }
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="button button--primary" type="submit" [disabled]="!form().valid() || pending()">
      Create
    </button>
  </form>
</div>
