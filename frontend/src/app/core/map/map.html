<div class="card stack">
  <h1>Mapa</h1>

  <app-location-map
    [locations]="locations"
    [route]="route()"
    (routeLength)="routeLength.set($event)"
  />

  @if (route() !== 'none' && routeLength() !== null) {
    <p>Dužina putanje: {{ routeLength()?.toFixed(2) }} km</p>
  }

  <div class="route-kinds">
    <button
      class="button"
      type="button"
      [class.button--primary]="route() === 'none'"
      (click)="select('none')"
    >
      Bez putanje
    </button>
    <button
      class="button"
      type="button"
      [class.button--primary]="route() === 'straight'"
      (click)="select('straight')"
    >
      Prave linije
    </button>
    <button
      class="button"
      type="button"
      [class.button--primary]="route() === 'streets'"
      (click)="select('streets')"
    >
      Po ulicama
    </button>
  </div>
</div>
