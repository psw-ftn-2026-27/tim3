<header>
  <nav class="container">
    <!-- One shared line under the links follows the mouse and keyboard focus (see app.ts). -->
    <span class="nav-links" (mouseleave)="hideIndicator()" (focusout)="hideIndicatorOnBlur($event)">
      <a
        routerLink="/"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: true }"
        (mouseenter)="moveIndicator($event)"
        (focus)="moveIndicator($event)"
        >Home</a
      >
      <a
        routerLink="/exploration"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (mouseenter)="moveIndicator($event)"
        (focus)="moveIndicator($event)"
        >Exploration</a
      >
      <a
        routerLink="/games"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (mouseenter)="moveIndicator($event)"
        (focus)="moveIndicator($event)"
        >Games</a
      >
      <a
        routerLink="/social"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (mouseenter)="moveIndicator($event)"
        (focus)="moveIndicator($event)"
        >Social</a
      >
      <a
        routerLink="/payment"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        (mouseenter)="moveIndicator($event)"
        (focus)="moveIndicator($event)"
        >Payment</a
      >

      <span
        class="nav-indicator"
        [class.sliding]="indicatorSliding()"
        [style.left.px]="indicatorLeft()"
        [style.width.px]="indicatorWidth()"
      ></span>
    </span>

    <span class="nav-user">
      @if (auth.user(); as user) {
        <span>{{ user.email }}</span>
        <button class="button" type="button" (click)="auth.logout()">Logout</button>
      } @else {
        <a routerLink="/login">Login</a>
        <a routerLink="/register">Register</a>
      }
    </span>
  </nav>

  <!-- Only the strip of the open module is shown (see app.scss); Home has none. -->
  <div class="module-strip exploration">
    <div class="container">
      <span class="module-strip-label">Exploration</span>
    </div>
  </div>
  <div class="module-strip games">
    <div class="container">
      <span class="module-strip-label">Games</span>
    </div>
  </div>
  <div class="module-strip social">
    <div class="container">
      <span class="module-strip-label">Social</span>
    </div>
  </div>
  <div class="module-strip payment">
    <div class="container">
      <span class="module-strip-label">Payment</span>
    </div>
  </div>
</header>

<main class="container stack">
  <router-outlet />
</main>
