<header>
  <nav class="container">
    <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/exploration" routerLinkActive="active" ariaCurrentWhenActive="page">Exploration</a>
    <a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">Games</a>
    <a routerLink="/social" routerLinkActive="active" ariaCurrentWhenActive="page">Social</a>
    <a routerLink="/payment" routerLinkActive="active" ariaCurrentWhenActive="page">Payment</a>

    <span class="nav-user">
      @if (auth.user(); as user) {
        <span>{{ user.email }}</span>
        <button class="button" type="button" (click)="auth.logout()">Logout</button>
      } @else {
        <a routerLink="/login">Login</a>
        <a routerLink="/register">Register</a>
      }
    </span>
  </nav>
</header>

<main class="container stack">
  <router-outlet />
</main>
